on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: s3
          DEFAULT_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - name: Start fake-gcs-server
        run: |
          docker run -d --name fake-gcs -p 4443:4443 fsouza/fake-gcs-server -scheme http -port 4443
          for i in $(seq 1 10); do
            curl -s http://localhost:4443/storage/v1/b && break || sleep 1
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --extra gcs

      - name: Run tests
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: uv run pytest

      - name: Check code formatting with Black
        run: uv run black . --check

      - name: Check import sorting with isort
        run: uv run isort --profile black . --check

      - name: Lint with Ruff
        run: uv run ruff check . --line-length 120
